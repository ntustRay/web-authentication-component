name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ["18.3.1", "19.3.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - if: matrix.react == '18.3.1'
        run: bun add --dev --exact react@18.3.1 react-dom@18.3.1
      - run: bun run verify
      - run: npm pack --ignore-scripts --dry-run
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: package-react-${{ matrix.react }}
          path: "*.tgz"
          retention-days: 14
