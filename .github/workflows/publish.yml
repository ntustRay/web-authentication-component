name: Publish npm package
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["package.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: prepare-web-auth-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dispatch an unpublished version from its immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          endpoint="https://registry.npmjs.org/@ntustray%2fweb-authentication-component/$version"
          status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "$endpoint")
          case "$status" in
            200) echo "Version $version is already published."; exit 0 ;;
            404) ;;
            *) echo "Registry returned HTTP $status"; exit 1 ;;
          esac
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          # GitHub does not start a push workflow for refs created by GITHUB_TOKEN.
          gh workflow run publish.yml --ref "$tag"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: publish-web-auth-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun audit
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Check tag and npm CLI
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')"
          node --version
          npm --version
      - name: Publish the verified package with npm Trusted Publishing
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          endpoint="https://registry.npmjs.org/@ntustray%2fweb-authentication-component/$version"
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack-result.json"
          archive=$(jq -er '.[0].filename' "$RUNNER_TEMP/pack-result.json")
          integrity=$(jq -er '.[0].integrity' "$RUNNER_TEMP/pack-result.json")
          status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "$endpoint")
          case "$status" in
            200) test "$(jq -er '.dist.integrity' "$RUNNER_TEMP/npm-version.json")" = "$integrity" ;;
            404) npm publish "./$archive" --access public --provenance --ignore-scripts ;;
            *) echo "Registry returned HTTP $status"; exit 1 ;;
          esac
      - name: Verify the published version in the public registry
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in {1..8}; do
            if [ "$(npm view "@ntustray/web-authentication-component@$version" version)" = "$version" ]; then exit 0; fi
            sleep 5
          done
          exit 1
